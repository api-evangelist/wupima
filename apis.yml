name: Wupima
description: Wupima, Inc. was a Virginia-based mobile social intelligence company that
  did business as Hook Mobile, backed by 500 Global (500 Startups). Its App Growth
  Engine (AGE) product offered iOS and Android SDKs and an API that let mobile app
  and game developers grow their user base through word-of-mouth SMS/MMS social invitations,
  device targeting, and conversion analytics. The company, founded by Terry Hsiao,
  was active roughly 2010-2016 and is now defunct - wupima.com is a dead S3 bucket
  (403 AllAccessDisabled) and hookmobile.com has been taken over by an unrelated
  domain squatter serving spam, so no live website, developer portal, or API surface
  remains. Profile retained as a historical 500 Global portfolio record.
